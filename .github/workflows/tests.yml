name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: python web/xval/gen_ref.py && node web/xval/xval.js
      - name: check that dist/index.html is up to date
        run: |
          python web/build.py
          git diff --exit-code dist/index.html || { echo "dist/index.html is out of date, run python web/build.py"; exit 1; }
