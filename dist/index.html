<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTGap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: instrument console. Inputs left, read-out right; one column on phones. Accent = Cherenkov blue. */
  --bg: #eef1f5; --panel: #ffffff; --panel-2: #f6f8fb; --ink: #0f1a2e; --muted: #56627a; --line: #d3dae5;
  --accent: #1c5fe0; --accent-ink: #ffffff; --accent-soft: #e3ecff; --glow: #6aa6ff;
  --good: #0c8463; --warn: #a86400; --bad: #c2314a; --good-soft: #e2f4ee; --warn-soft: #fbf0db; --bad-soft: #fbe6ea;
  --tank: #07101f; --tank-ink: #eaf0fb; --tank-muted: #a9b8d6; --bt: #7a3fb8; --dose: #f3b45a;
  --grid-major: rgba(28, 95, 224, 0.07); --grid-minor: rgba(15, 26, 46, 0.035); --shadow: 0 1px 2px rgba(15, 26, 46, 0.05), 0 6px 18px rgba(15, 26, 46, 0.05);
  --f-display: "STIX Two Text", "Cambria", "Times New Roman", serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #070d1a; --panel: #0e1729; --panel-2: #131e35; --ink: #e6ecf8; --muted: #9aa8c3; --line: #25324d;
    --accent: #6aa6ff; --accent-ink: #06122b; --accent-soft: #14284f; --glow: #8fbcff;
    --good: #4fd0a8; --warn: #f0b451; --bad: #ff8094; --good-soft: #0f2c27; --warn-soft: #33270f; --bad-soft: #3a1820;
    --tank: #040915; --tank-ink: #e8eefb; --tank-muted: #9fb0cf;
    --grid-major: rgba(106, 166, 255, 0.07); --grid-minor: rgba(106, 166, 255, 0.025); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070d1a; --panel: #0e1729; --panel-2: #131e35; --ink: #e6ecf8; --muted: #9aa8c3; --line: #25324d;
  --accent: #6aa6ff; --accent-ink: #06122b; --accent-soft: #14284f; --glow: #8fbcff;
  --good: #4fd0a8; --warn: #f0b451; --bad: #ff8094; --good-soft: #0f2c27; --warn-soft: #33270f; --bad-soft: #3a1820;
  --tank: #040915; --tank-ink: #e8eefb; --tank-muted: #9fb0cf;
  --grid-major: rgba(106, 166, 255, 0.07); --grid-minor: rgba(106, 166, 255, 0.025); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--f-body);
  background-color: var(--bg);
  /* semi-log graph paper: one major line per decade, faint minor lines */
  background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px),
    linear-gradient(var(--grid-minor) 1px, transparent 1px);
  background-size: 100% 120px, 24px 100%, 100% 36px; background-attachment: fixed; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--accent); }
.num, td.n, .kv dd, input[type="number"], input[type="date"] { font-variant-numeric: tabular-nums; }

/* header: a tank of water with a semi-log plot of cell survival behind the title */
.top { position: relative; overflow: hidden; color: var(--tank-ink);
  background: radial-gradient(90% 140% at 88% -10%, rgba(44, 104, 230, 0.55) 0%, transparent 55%),
              radial-gradient(60% 120% at 0% 120%, rgba(243, 180, 90, 0.10) 0%, transparent 60%), var(--tank); }
#hero { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.top-in { position: relative; max-width: 1320px; margin: 0 auto; padding: 30px 16px 26px; display: flex; flex-wrap: wrap; gap: 18px 36px; align-items: flex-end; justify-content: space-between; min-height: 210px; }
.brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; max-width: 640px; }
.logo-row { display: flex; align-items: center; gap: 14px; }
.logo { width: 46px; height: 46px; flex: none; color: var(--tank-ink); }
.brand h1 { font: 600 3rem/0.95 var(--f-display); letter-spacing: -0.01em; }
.brand h1 i { color: var(--glow); font-style: italic; text-shadow: 0 0 22px rgba(106, 166, 255, 0.8); }
.brand p { margin: 0; color: var(--tank-ink); font-size: 1.02rem; opacity: 0.92; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font: 500 0.72rem/1 var(--f-num); letter-spacing: 0.04em; color: var(--tank-muted); border: 1px solid rgba(159, 176, 207, 0.35); border-radius: 99px; padding: 5px 9px; background: rgba(4, 9, 21, 0.35); backdrop-filter: blur(2px); }
.side { display: grid; gap: 10px; justify-items: start; }
.eq { font: italic 1.05rem/1.3 var(--f-display); color: var(--tank-muted); white-space: nowrap; background: rgba(4, 9, 21, 0.45); border: 1px solid rgba(159, 176, 207, 0.22); border-radius: 10px; padding: 8px 12px; }
.eq b { font-weight: 400; color: var(--tank-ink); }
.topctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.top .seg { border-color: #2c3e66; background: transparent; }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 0.86rem; color: var(--muted); }
.top .seg button { color: var(--tank-muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.top .seg button[aria-pressed="true"] { background: #2a63d8; color: #fff; }
.top select, .top .ghost { background: transparent; color: var(--tank-ink); border: 1px solid #2c3e66; border-radius: 8px; padding: 6px 9px; font-size: 0.86rem; max-width: 220px; }
.top select option { color: #111; }
.top .ghost { cursor: pointer; }

.grid { max-width: 1320px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(330px, 440px) minmax(0, 1fr); gap: 16px; align-items: start; }
.wide { max-width: 1320px; margin: 0 auto; padding: 0 16px 16px; display: grid; gap: 16px; }
.col { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); }
.card > h2, .card > summary > h2 { font: 600 1.12rem/1.25 var(--f-display); margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card > h2 .step, .card > summary > h2 .step { font: 600 0.72rem/1 var(--f-num); color: var(--accent-ink); background: var(--accent); border-radius: 7px; padding: 4px 7px; min-width: 22px; text-align: center; }
.hint { color: var(--muted); font-size: 0.84rem; margin: 0 0 10px; max-width: 68ch; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 12px; }
.f { display: grid; gap: 3px; min-width: 0; }
.f > span { font-size: 0.78rem; color: var(--muted); }
.f input, .f select, .inp { width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); }
.f input:focus, .f select:focus, .inp:focus, button:focus-visible, .cal button:focus-visible, .ref:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; padding: 3px 0; cursor: pointer; }
.chk input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.sw { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 2px 14px; margin-bottom: 10px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.sm { padding: 3px 9px; font-size: 0.82rem; }
.btn.x { padding: 2px 8px; color: var(--muted); }
.rowbtn { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font-size: 0.8rem; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; white-space: nowrap; }
.pill.c1 { background: var(--bad-soft); color: var(--bad); } .pill.c2 { background: var(--warn-soft); color: var(--warn); } .pill.c3 { background: var(--good-soft); color: var(--good); }
.pill.plain { background: var(--panel-2); color: var(--muted); border-color: var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; font-size: 0.86rem; }
ul.notes { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.84rem; }
.phase { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; }
.lvl { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 6px; align-items: end; }
.oar { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)) auto; gap: 6px; align-items: end; margin-bottom: 6px; }
.oar .f > span, .lvl .f > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wdays { display: flex; gap: 4px; flex-wrap: wrap; }
.wdays button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 4px 8px; font-size: 0.82rem; cursor: pointer; color: var(--muted); }
.wdays button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* calendar */
.cal { display: grid; grid-template-columns: 40px repeat(7, minmax(0, 34px)); gap: 3px; margin: 8px 0; }
.cal .wl, .cal .hd { font: 0.68rem/1 var(--f-num); color: var(--muted); display: flex; align-items: center; }
.cal .hd { justify-content: center; }
.cal .c { height: 30px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); font: 0.72rem/1 var(--f-num); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; position: relative; }
.cal button.c { cursor: pointer; }
.cal .c.wk { background: var(--panel-2); border-color: var(--panel-2); }
.cal .c.planned { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--ink); }
.cal .c.delivered { background: #33415f; border-color: #33415f; color: #fff; }
.cal .c.new { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cal .c.bid { background: #0d3a99; border-color: #0d3a99; color: #fff; font-weight: 700; }
.cal .c.bid small { font-size: 0.56rem; }
.cal .c.missed { background: var(--panel); border: 2px solid var(--bad); color: var(--bad); font-weight: 700; text-decoration: line-through; }
.cal .c.closed { background: repeating-linear-gradient(45deg, var(--panel), var(--panel) 3px, var(--line) 3px, var(--line) 5px); color: var(--muted); }
.cal .c.bt { background: var(--bt); border-color: var(--bt); color: #fff; font-weight: 600; font-size: 0.62rem; }
.cal .c.unavail { border: 2px dashed var(--warn); color: var(--warn); }
.cal .c.chemo::after { content: ""; position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.cal .c.endmark { box-shadow: 0 0 0 2px var(--ink); }
.cal .c.out { opacity: 0.45; }
.cal .c.delivered.xtra { background: #5a3fa0; border-color: #5a3fa0; }
.cal .c.errd { box-shadow: inset 0 0 0 2px var(--warn); }
.cal .c.errd::before { content: "!"; position: absolute; left: 3px; top: 1px; font: 700 0.6rem/1 var(--f-num); color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.76rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }

/* decision */
.decision { border-left: 6px solid var(--accent); background: linear-gradient(100deg, var(--accent-soft), var(--panel) 46%); }
.decision.no_action { background: linear-gradient(100deg, var(--good-soft), var(--panel) 46%); } .decision.clinical_decision { background: linear-gradient(100deg, var(--warn-soft), var(--panel) 46%); } .decision.error { background: linear-gradient(100deg, var(--bad-soft), var(--panel) 46%); }
.decision.no_action { border-left-color: var(--good); } .decision.clinical_decision { border-left-color: var(--warn); } .decision.error { border-left-color: var(--bad); }
.status { font: 500 0.74rem/1 var(--f-num); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.decision.no_action .status { color: var(--good); } .decision.clinical_decision .status { color: var(--warn); } .decision.error .status { color: var(--bad); }
.headline { font: 600 1.65rem/1.15 var(--f-display); margin: 6px 0 6px; }
.subline { font: 0.92rem/1.4 var(--f-num); color: var(--muted); margin: 0 0 8px; }
ol.trace { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: 0.9rem; max-width: 76ch; }
ol.trace li::marker { color: var(--muted); font: 0.8rem var(--f-num); }
.ref { border: 0; background: transparent; color: var(--accent); font: 600 0.74rem/1 var(--f-num); cursor: pointer; padding: 1px 2px; vertical-align: super; }
details > summary { cursor: pointer; font-weight: 600; }
details > summary + * { margin-top: 8px; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
th { font-weight: 600; font-size: 0.76rem; color: var(--muted); vertical-align: bottom; }
th:first-child, td:first-child { text-align: left; }
td.n { font-family: var(--f-num); font-size: 0.84rem; white-space: nowrap; }
td.t { min-width: 150px; }
tr.sel td { background: var(--accent-soft); }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--panel-2); } tr.pick.sel:hover td { background: var(--accent-soft); }
.pos { color: var(--good); } .neg { color: var(--bad); } .zero { color: var(--muted); }
.tag { display: inline-block; font: 0.7rem/1 var(--f-num); padding: 2px 6px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); margin: 2px 4px 0 0; }
.tag.rec { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.why { color: var(--bad); font-size: 0.82rem; margin-top: 3px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 0.9rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.split { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; }
.split > .grow { flex: 1 1 300px; min-width: 0; }
ul.warn { margin: 8px 0 0; padding-left: 18px; color: var(--warn); font-size: 0.86rem; display: grid; gap: 3px; }
ul.err { margin: 8px 0 0; padding-left: 18px; color: var(--bad); font-size: 0.9rem; }
.chartbox { position: relative; width: 100%; height: 250px; }
.chartbox canvas { width: 100%; height: 100%; display: block; }
.small { font-size: 0.82rem; color: var(--muted); }
.reflist { margin: 0; padding-left: 26px; display: grid; gap: 10px; font-size: 0.9rem; max-width: 92ch; }
.reflist li::marker { font: 0.8rem var(--f-num); color: var(--accent); }
.reflist .use { color: var(--muted); font-size: 0.84rem; display: block; margin-top: 2px; }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.out { font: 0.9rem/1.5 var(--f-num); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-top: 10px; white-space: pre-wrap; }
.foot { background: var(--tank); color: var(--tank-muted); margin-top: 18px; font-size: 0.82rem; }
.foot-in { max-width: 1320px; margin: 0 auto; padding: 22px 16px 90px; display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 2fr); gap: 14px 36px; }
.foot-brand { font: 600 1.4rem/1 var(--f-display); color: var(--tank-ink); margin-bottom: 8px; } .foot-brand i { color: var(--glow); }
.foot-brand span { font: 400 0.75rem var(--f-num); color: var(--tank-muted); margin-left: 6px; vertical-align: middle; }
.foot p { margin: 0 0 6px; max-width: 92ch; } .foot b { color: var(--tank-ink); font-weight: 600; } .foot a { color: var(--glow); }
@media (max-width: 720px) { .foot-in { grid-template-columns: 1fr; } }

#refpop { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; box-shadow: 0 12px 40px rgba(5, 12, 30, 0.35); z-index: 30; font-size: 0.88rem; }
#refpop[hidden] { display: none; }
#refpop .n { font: 600 0.8rem var(--f-num); color: var(--accent); }
#refpop .close { float: right; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--tank); color: var(--tank-ink); padding: 9px 14px; display: none; gap: 10px; align-items: center; z-index: 20; border: 0; width: 100%; text-align: left; cursor: pointer; }
.dock b { font: 500 0.7rem/1 var(--f-num); letter-spacing: 0.06em; text-transform: uppercase; color: var(--glow); white-space: nowrap; }
.dock span { font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 7px 14px; border-radius: 8px; font-size: 0.86rem; z-index: 40; }
@media (max-width: 520px) {
  .top-in { padding-top: 22px; min-height: 0; } .eq { white-space: normal; font-size: .92rem; }
  .oar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .oar .f:first-child { grid-column: 1 / -1; }
  .brand h1 { font-size: 2.3rem; } .logo { width: 38px; height: 38px; } .headline { font-size: 1.25rem; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color 0.15s; } }

/* folded input sections */
details.fold > summary { list-style: none; cursor: pointer; display: grid; gap: 4px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { margin: 0; align-items: center; flex-wrap: nowrap; }
details.fold > summary h2::after { content: "▾"; margin-left: auto; color: var(--muted); font-size: 0.95rem; transition: transform 0.15s; }
details.fold:not([open]) > summary h2::after { transform: rotate(-90deg); }
details.fold > summary:hover h2::after { color: var(--accent); }
.fold-sum { font: 0.8rem/1.45 var(--f-num); color: var(--muted); }
details.fold[open] > summary { margin-bottom: 10px; }
details.fold[open] .fold-sum { display: none; }
.gl-row { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.help { border: 1px solid var(--line); background: var(--panel-2, transparent); color: var(--accent); border-radius: 50%; width: 19px; height: 19px; font: 600 0.7rem/1 var(--f-body); cursor: pointer; padding: 0; margin: 0 2px 0 6px; vertical-align: 1px; }
.help:hover, .help:focus-visible { border-color: var(--accent); }
.dock.show { display: flex; }
@media (min-width: 901px) { .dock { left: auto; right: 20px; bottom: 20px; width: auto; max-width: 560px; border-radius: 12px; box-shadow: 0 10px 30px rgba(5, 12, 30, 0.35); } }
.split > * { min-width: 0; } .kv dd { overflow-wrap: anywhere; }

details.sub { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; margin: 10px 0 4px; }
details.sub > summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; }
h3.mini { font: 600 0.85rem var(--f-body); margin: 12px 0 4px; color: var(--ink); }
.intr { margin: 2px 0 8px; }

.proto { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
.proto-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.proto-head .pill { margin-left: auto; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font: inherit; text-decoration: underline; cursor: pointer; }

.warnnote { color: var(--warn); }

</style>
</head>
<body>
<header class="top">
  <canvas id="hero" aria-hidden="true"></canvas>
  <div class="top-in">
    <div class="brand">
      <div class="logo-row">

        repair: ['Repair half-time T½', 'How fast a tissue repairs sublethal damage between two fractions on the same day. With long half-times (about 4 h for late effects), 6 h is not enough for full repair, so twice-daily treatment adds late-tissue dose.'],
        eqd2: ['EQD2', 'The total dose in 2-Gy fractions that would have the same biological effect. For the tumour it is also corrected for repopulation (EQD2_T). The tables show the change from the prescribed plan.'],

        guidance: ['RCR guidance: 2019 or 5th edition draft', 'Both editions keep the same decision order and categories. With the 5th edition draft: (1) 1-week breast schedules get no extra dose for an interruption and should finish within 3 weeks where possible; (2) 3-week breast schedules should not exceed an overall time of 5 weeks; (3) medulloblastoma aims for a total time under 45 days; (4) BID on a chemotherapy day is excluded only when the chemotherapy is not daily or d > 1.5 Gy, while the 2019 text advises against accelerated treatment on any day of concomitant chemotherapy. In both editions SABR resumes on non-consecutive days.'],
