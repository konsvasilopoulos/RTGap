# rtgap site library
# ------------------
# One entry per tumour site / histology / intent. Every field can be
# overridden per case, or for the whole department in a protocol file.
#
# category                RCR category (1, 2, 3) or null
# max_extension_days      prolongation above which compensation is required
# ideal_extension_days    prolongation the compensation should aim for
#                         (defaults: cat 1 -> 0 / 2, cat 2 -> 2 / 5, cat 3 -> 7 / 7)
# max_overall_time_days   hard cap on overall treatment time (optional)
# no_acceleration         true = weekend / BID / fewer-larger fractions not appropriate
# tumour                  alpha_beta, k_bed_per_day (RCR K, BED/day) or
#                         dprolif_eqd2_per_day (EQD2/day), kickoff_days
# oars                    default organs at risk (first = reference late tissue)
#
# Sources
#   RCR19  RCR, The timely delivery of radical radiotherapy, 4th ed. (2019)
#   RCR5d  RCR, Management of unscheduled radiotherapy treatment interruptions,
#          5th ed., draft for consultation
#   START  Haviland et al., Lancet Oncol 2013 (alpha/beta 3.5 Gy, tumour control)
#   VB20   Vogelius & Bentzen, IJROBP 2020 (prostate alpha/beta 1.6 Gy)
#   STARTT Haviland et al., Radiother Oncol 2016 (breast: about 0.6 Gy/day, hypothesis-generating)
#   VB13   Vogelius & Bentzen, IJROBP 2013 (prostate: 0.31 Gy/day, 95% CI 0.20-0.42)
#   WITHERS88  Withers, Taylor & Maciejewski, Acta Oncol 1988 (head and neck: about 0.6 Gy/day after 4 +/- 1 weeks)
#   ROBERTS94  Roberts, Hendry & Brewster, Br J Radiol 1994 (larynx: 0.8 Gy/day, 95% CI 0.5-1.1; lag 21 d, 95% CI 0-27)
#   KOUK96     Koukourakis et al., IJROBP 1996 (NSCLC: 0.45 Gy/day beyond 20 days; 0.2 without mediastinal involvement)
#   MM91       Maciejewski & Majewski, Radiother Oncol 1991 (bladder: 0.36 Gy/day after a lag of 5-6 weeks)
#   HUANG12    Huang et al., IJROBP 2012 (cervix: onset of repopulation 19 days, range 11-22)
#
# published_time_factors  published estimates of the dose lost per day of prolongation (Gy EQD2/day) and
#                     of the kick-off time, each with its source. They are offered to the user and never
#                     applied by default: the default of the category-1 entries stays the RCR generic value.
#                     ci = 95% confidence interval as published; kickoff_range = a range that is not a CI.
#                     Only values read in the source itself (or its abstract) are listed. Entries with
#                     kick-off 0 are linear over the whole course, so only differences of EQD2_T between
#                     schedules are meaningful.
#
# The radiobiological parameters of the category-1 entries are the RCR
# *generic* values (alpha/beta 10, K 0.9 Gy10/day after 28 d). RCR19 gives
# no site-specific K. Departments should review them.

defaults:
  late_oar: {name: "Late (α/β 3)", alpha_beta: 3}
  cat1_tumour: &cat1 {alpha_beta: 10, k_bed_per_day: 0.9, kickoff_days: 28}

sites:
  # ---------------- Category 1 (RCR19 / RCR5d) ----------------
  hn_scc:
    name: "Squamous cell carcinoma, head & neck"
    category: 1
    tumour: *cat1
    oars: [{name: "Late (α/β 3)", alpha_beta: 3}, {name: "Spinal cord", alpha_beta: 2}]
    sources: [RCR19]
    published_time_factors:
      - {dprolif_eqd2_per_day: 0.6, kickoff_days: 28, kickoff_range: [21, 35], source: WITHERS88, scope: hn_withers}
      - {dprolif_eqd2_per_day: 0.8, ci: [0.5, 1.1], kickoff_days: 21, kickoff_ci: [0, 27], source: ROBERTS94, scope: larynx_bir}
  nsclc:
    name: "Non-small cell lung cancer (radical)"
    category: 1
    tumour: *cat1
    oars: [{name: "Late (α/β 3)", alpha_beta: 3}, {name: "Spinal cord", alpha_beta: 2}]
    sources: [RCR19]
    published_time_factors:
      - {dprolif_eqd2_per_day: 0.45, kickoff_days: 20, source: KOUK96, scope: nsclc_kouk}
  sclc_chemort:
    name: "Small cell lung cancer, chemoradiotherapy"
    category: 1
    tumour: *cat1
    oars: [{name: "Late (α/β 3)", alpha_beta: 3}, {name: "Spinal cord", alpha_beta: 2}]
    sources: [RCR19]
  cervix_scc:
    name: "Squamous cell carcinoma, cervix (external beam)"
    category: 1
    max_overall_time_days: 56
    tumour: *cat1
    sources: [RCR19]
    published_time_factors:
      - {kickoff_days: 19, kickoff_ci: [11, 22], source: HUANG12, scope: cervix_huang}
    notes: ["RCR: overall treatment time for squamous cervix should not exceed 56 days."]
  oesophagus_scc:
    name: "Squamous cell carcinoma, oesophagus"
    category: 1
    tumour: *cat1
    sources: [RCR19]
  oesophagus_adeno:
    name: "Adenocarcinoma, oesophagus"
    category: 1
    tumour: *cat1
    sources: [RCR19]
  anus_scc:
    name: "Squamous cell carcinoma, anus"
    category: 1
    tumour: *cat1
    sources: [RCR19]
  skin_scc:
    name: "Squamous cell carcinoma, skin"
    category: 1
    tumour: *cat1
    sources: [RCR19]
  vulva_vagina_scc:
    name: "Squamous cell carcinoma, vulva / vagina"
    category: 1
    tumour: *cat1
    sources: [RCR19]
  medulloblastoma:
    name: "Medulloblastoma / CNS embryonal tumours"
    category: 1
    tumour: *cat1
    oars: [{name: "Late (α/β 3)", alpha_beta: 3}, {name: "Brainstem / cord", alpha_beta: 2}]
    sources: [RCR19]
    rcr5_draft: {target_overall_time_days: 44, rule: medullo}
  glioblastoma:
    name: "Glioblastoma"
    category: 1
    tumour: *cat1
    oars: [{name: "Late (α/β 3)", alpha_beta: 3}, {name: "Brainstem / optic", alpha_beta: 2}]
    sources: [RCR19, RCR5d]
    notes: ["2019 edition: described as very fast-growing, not in the category list. Category 1 in the 5th edition draft."]
  ependymoma_intracranial:
    name: "Intracranial ependymoma"
    category: 1
    tumour: *cat1
    oars: [{name: "Late (α/β 3)", alpha_beta: 3}, {name: "Brainstem / cord", alpha_beta: 2}]
    sources: [RCR5d]
    notes: ["Not mentioned in the 2019 edition. Category 1 in the 5th edition draft."]
  bladder:
    name: "Carcinoma of bladder (radical)"
    category: 1
    tumour: *cat1
    sources: [RCR5d]
    published_time_factors:
      - {dprolif_eqd2_per_day: 0.36, kickoff_days: 35, kickoff_range: [35, 42], source: MM91, scope: bladder_mm}
    notes: ["Category 1 in the 5th edition draft and in the RCR bladder consensus statements, to which the RCR page of the 2019 guidance refers. The 2019 text itself lists bladder in category 2 (entry 'Carcinoma of bladder (2019 classification)')."]
  short_doubling:
    name: "Other tumour with short mass-doubling time"
    category: 1
    tumour: *cat1
    sources: [RCR19]

  # ---- Category 1, combined brachytherapy + external beam ----
  cervix_scc_brachy:
    name: "Squamous cervix, EBRT + brachytherapy"
    category: 1
    ideal_extension_days: 0
    max_extension_days: 1
    max_overall_time_days: 56
    tumour: *cat1
    sources: [RCR19]
    published_time_factors:
      - {kickoff_days: 19, kickoff_ci: [11, 22], source: HUANG12, scope: cervix_huang}
    notes: ["RCR: combined brachytherapy + EBRT, maximum prolongation 1–2 days (1 used here; set 2 if local protocol allows).",
            "Overall time should not exceed 56 days."]
  vulva_vagina_scc_brachy:
    name: "Squamous vulva / vagina, EBRT + brachytherapy"
    category: 1
    ideal_extension_days: 0
    max_extension_days: 1
    tumour: *cat1
    sources: [RCR19, RCR5d]
    notes: ["RCR: combined brachytherapy + EBRT, maximum prolongation 1–2 days."]
  tongue_scc_brachy:
    name: "Squamous tongue, EBRT + brachytherapy"
    category: 1
    ideal_extension_days: 0
    max_extension_days: 1
    tumour: *cat1
    sources: [RCR19]
    notes: ["RCR: combined brachytherapy + EBRT, maximum prolongation 1–2 days."]
  anus_scc_brachy:
    name: "Squamous anus, EBRT + brachytherapy"
    category: 1
    ideal_extension_days: 0
    max_extension_days: 1
    tumour: *cat1
    sources: [RCR19]
    notes: ["RCR: combined brachytherapy + EBRT, maximum prolongation 1–2 days."]

  # ---------------- Category 2 ----------------
  breast:
    name: "Breast adenocarcinoma (radical / adjuvant)"
    category: 2
    tumour: {alpha_beta: 3.5}
    published_time_factors:
      - {dprolif_eqd2_per_day: 0.6, ci: [0.10, 1.18], kickoff_days: 0, source: STARTT, scope: breast_start}
    oars: [{name: "Late (α/β 3)", alpha_beta: 3}]
    sources: [RCR19, START]
    notes: ["Tumour α/β 3.5 Gy (START, 95% CI 1.2–5.7). No time factor by default.",
            "The 5th edition draft adds rules for hypofractionated breast: 1-week schedules get no extra dose, 3-week schedules finish within 5 weeks (choose the 5th edition in the department settings)."]
    rcr5_draft:
      by_fractions:
        - {max_fractions: 5, no_dose_compensation: true, target_overall_time_days: 20, rule: breast_1wk}
        - {min_fractions: 13, max_fractions: 16, max_overall_time_days: 34, rule: breast_3wk}
  prostate:
    name: "Prostate carcinoma (radical)"
    category: 2
    tumour: {alpha_beta: 1.6}
    published_time_factors:
      - {dprolif_eqd2_per_day: 0.31, ci: [0.20, 0.42], kickoff_days: 0, source: VB13, scope: prostate_vb}
    oars: [{name: "Rectum (late, α/β 3)", alpha_beta: 3}]
    sources: [RCR19, VB20]
    notes: ["Tumour α/β 1.6 Gy (Vogelius & Bentzen 2020, 95% CI 1.3–2.0). No time factor by default.",
            "With α/β below the late-tissue value, fewer/larger fractions favour the tumour: check both 'match' variants."]
  bladder_rcr2019:
    name: "Carcinoma of bladder (2019 classification)"
    category: 2
    tumour: {alpha_beta: 10}
    sources: [RCR19]
    published_time_factors:
      - {dprolif_eqd2_per_day: 0.36, kickoff_days: 35, kickoff_range: [35, 42], source: MM91, scope: bladder_mm}
    notes: ["Use 'bladder' to follow the 5th edition draft (category 1)."]
  rectum:
    name: "Rectal adenocarcinoma (radical / neoadjuvant)"
    category: 2
    tumour: {alpha_beta: 10}
    oars: [{name: "Bowel (late, α/β 4)", alpha_beta: 4}]
    sources: [RCR19]
    notes: ["Category 2 as a 'remaining radical' tumour."]
  radical_other:
    name: "Other radical treatment (category 2)"
    category: 2
    tumour: {alpha_beta: 10}
    sources: [RCR19]

  # ---------------- Category 3 ----------------
  palliative:
    name: "Palliative treatment"
    category: 3
    tumour: {alpha_beta: 10}
    sources: [RCR19]

  # ---------------- Special ----------------
  sabr:
    name: "SABR / stereotactic"
    category: null
    no_acceleration: true
    tumour: {alpha_beta: 10}
    sources: [RCR19]
    notes: ["RCR (2019 and 5th edition draft): accelerated scheduling is not appropriate for SABR; after an unintended delay treatment resumes on non-consecutive days. Follow the local SABR protocol."]
  generic:
    name: "Generic (no site rules)"
    category: null
    tumour: {alpha_beta: 10}
    notes: ["No category rules: set max_extension_days / ideal_extension_days in the case or protocol."]
